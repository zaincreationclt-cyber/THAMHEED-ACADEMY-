*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Poppins","Noto Sans Malayalam",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.w{max-width:560px;margin:0 auto;padding:18px 16px 120px;min-height:100vh}
.lg{display:inline-block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;width:1.9em;height:1em}
h1{font-size:1.6rem;line-height:1.25;margin:0;font-weight:700}h2{font-size:1.05rem;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.m{color:var(--mut);font-size:.88rem}
/* login */
.sp{min-height:100vh;background:var(--lime);color:#14161a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;margin:-18px -16px -120px;max-width:none}
.sp .ic{width:112px;height:112px;border-radius:30px;background:#222;color:#fff;display:grid;place-items:center;font-size:56px;margin-bottom:12px;box-shadow:0 14px 30px rgba(0,0,0,.2)}
.sp .wm{font-size:2.1rem;font-weight:700;letter-spacing:-.5px;line-height:1.1}.sp .ac{letter-spacing:.35em;font-weight:500;margin:2px 0 30px}
.sp input{width:100%;max-width:340px;height:54px;border-radius:16px;border:0;background:rgba(255,255,255,.55);padding:0 18px;font-size:1.05rem;text-align:center;outline:none}
.sp input:focus{background:#fff}
.go{width:100%;max-width:340px;height:54px;border-radius:16px;background:#14161a;color:var(--lime);font-weight:700;font-size:1.05rem;margin-top:12px}
.sp p{margin:12px 0 0;font-weight:500;min-height:1.4em}
.sp .lk{margin-top:26px;font-size:.85rem;opacity:.7;text-decoration:underline}
/* student */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.hd>div{flex:1;min-width:0}
.rb{position:relative;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.rb svg{width:22px;height:22px}.rb i{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--lime);color:#14161a;font:700 .72rem/20px Poppins;text-align:center;font-style:normal}
.av{background:var(--dk);color:var(--lime);font-weight:700}
.sr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:50px;margin:14px 0}
.sr input{flex:1;border:0;background:none;outline:none;min-width:0}.sr svg{width:20px;color:var(--mut)}
.urg{display:flex;gap:14px;align-items:center;background:var(--dk);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;border-left:6px solid var(--lime);text-align:left;width:100%;box-shadow:var(--sh)}
.urg b{color:var(--lime);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.urg p{margin:0;font-weight:600}
.pl{flex:none;width:44px;height:44px;border-radius:50%;background:var(--lime);color:#14161a;display:grid;place-items:center;animation:pl 1.6s infinite}.pl svg{width:22px}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(143,209,0,.7)}80%,100%{box-shadow:0 0 0 14px rgba(143,209,0,0)}}
.ct{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--lime),#7fbf00);color:#14161a;border-radius:24px;padding:20px;margin:6px 0}
.ct .lg{position:absolute;right:-14px;bottom:-14px;font-size:120px;opacity:.14}.ct small{opacity:.75;font-weight:500}
.ct h3{margin:2px 0 2px;font-size:1.35rem;line-height:1.25}.ct p{margin:0 0 14px;font-weight:500}
.bk{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:14px;background:#14161a;color:var(--lime);font-weight:600;text-decoration:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:500}
.cats i{width:100%;aspect-ratio:1;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--lt)}.cats svg{width:28px;height:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.row{display:flex;gap:14px;align-items:center}.row>.g{flex:1;min-width:0}.row b{display:block}
.cv{flex:none;width:58px;height:58px;border-radius:16px;background:var(--lime);color:#14161a;display:grid;place-items:center}.cv svg{width:28px}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--line);color:var(--mut)}.chip.l{background:var(--lime);color:#14161a}.chip.u{background:var(--bad);color:#fff}
.op{display:inline-block;margin-top:6px;padding:5px 16px;border-radius:99px;background:var(--dk);color:var(--lime);font-weight:600;font-size:.85rem;text-decoration:none}
.card.ur{border-left:6px solid var(--lime);background:var(--dk);color:#fff}.card.ur .m{color:#cfd4c4}
details summary{cursor:pointer;list-style:none;font-weight:600}details summary::-webkit-details-marker{display:none}details p{white-space:pre-wrap;margin:10px 0 0}
.dh{margin:18px 0 8px;font-weight:700;display:flex;gap:8px;align-items:center}.dh.td{color:var(--lt)}
.sl{display:flex;gap:14px;align-items:center}.sl .tm{flex:none;width:74px;font-weight:700;color:var(--lt);line-height:1.2}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center}
nav div{width:100%;max-width:560px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--mut)}nav svg{width:24px;height:24px}nav .on{color:var(--lt)}
nav .on i{background:var(--lime);color:#14161a}nav i{width:46px;height:28px;border-radius:14px;display:grid;place-items:center}
.md{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.md>div{width:100%;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.btn{display:block;width:100%;height:50px;border-radius:15px;background:var(--lime);color:#14161a;font-weight:700;margin-top:10px}.btn.k{background:var(--dk);color:var(--lime)}.btn.o{background:none;border:2px solid var(--line);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14161a;color:var(--lime);padding:10px 18px;border-radius:99px;z-index:70;font-weight:600}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cg button{position:relative;aspect-ratio:1/.85;border-radius:28px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--sh);font-size:1.9rem;font-weight:700}
.cg button.my{border-color:var(--lime);box-shadow:0 0 0 3px rgba(143,209,0,.28)}
.cg small{position:absolute;left:0;right:0;bottom:9px;font-size:.62rem;font-weight:600;color:var(--lt)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sg button{position:relative;overflow:hidden;border-radius:26px;padding:20px 8px 18px;text-align:center;font-weight:600;font-size:1rem}
.sg .ci{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:#fff}.sg .ci svg{width:32px}
.sg .ar{font:700 1.8rem/1.5 Amiri,serif;display:block}
.sg .rbn{position:absolute;left:0;right:0;top:50px;background:#5ddeb0;color:#fff;font-weight:700;font-size:.85rem;padding:9px 0;text-transform:uppercase}
.wa{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;z-index:45;box-shadow:0 8px 20px rgba(0,0,0,.28)}.wa svg{width:32px;height:32px}
/* admin */
body.adm{--ink:#f3f5ef;--bg:#0e0f11;--card:#1a1c1f;--mut:#9aa0a6;--line:#2a2d31;--lt:#a8e61f;--sh:none}
.at{display:flex;gap:8px;overflow-x:auto;margin:14px -16px;padding:0 16px 4px}.at button{flex:none;padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.88rem}.at .on{background:var(--lime);color:#14161a;border-color:var(--lime)}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 4px}
input.f,select.f,textarea.f{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px 12px;outline:none}input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--lime)}
.dys{display:flex;gap:6px;flex-wrap:wrap}.dys button{padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:.82rem;font-weight:600}.dys .on{background:var(--lime);color:#14161a;border-color:var(--lime)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{text-align:center;margin:0}.st b{font-size:1.8rem;color:var(--lime);display:block}
.dl{flex:none;min-width:38px;height:38px;padding:0 8px;border-radius:12px;background:rgba(229,72,77,.15);color:var(--bad);display:grid;place-items:center;font-size:.7rem;font-weight:700}.dl svg{width:18px}
.bz{position:fixed;inset:0;z-index:80;background:rgba(14,15,17,.85);color:var(--lime);display:grid;place-items:center;font-weight:700}
</style>
